<!DOCTYPE html>
<html>
  <head>
    <title>Escape Inside</title>
    <style>
      body {
        background: linear-gradient(135deg, #EBE3CC 0%, #f5f0e1 50%, #EBE3CC 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* 🖼 Banner container with relative positioning */
      .banner-container {
        position: relative;
        width: 100%;
        max-height: 300px;
        overflow: hidden;
      }

      .banner {
        width: 100%;
        height: 300px;
        object-fit: cover;
        object-position: center 60%;
        display: block;
      }

      /* 🔝 Overlay nav on top of the banner */
      .overlay-nav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 2rem;
        display: flex;
        align-items: flex-end;
      }

      .overlay-nav img {
        height: 50px;
        margin-right: 1rem; /* Add spacing between the logo and nav links */
      }

      .nav-links {
        display: flex;
        gap: 1.5rem;
        
      }

      .nav-links a {
        color: #EBE3CC;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      }

      .nav-links a:hover {
        text-decoration: underline;
      }

      /* 🧩 Main logo and content */
      .logo {
        max-width: 300px;
        width: 80%;
        height: auto;
        margin: 1rem auto 0.5rem auto;
        display: block;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        transition: transform 0.3s ease;
      }

      .logo:hover {
        transform: scale(1.05);
      }

      .content {
        text-align: center;
        padding: 0.5rem 2rem 1rem 2rem;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        margin: 1rem 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .content h1 {
        color: #2b2b2b;
        font-size: 2.2rem;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        background: linear
